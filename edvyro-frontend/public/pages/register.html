<!DOCTYPE html>
<html lang="en">
<head>
    <!--{DOCUMENT METADATA}-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101326">
    <title>Create Account | InternBoard</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="icon" href="../assets/optimized/favicon.png" type="image/png">
</head>
<body>
    <div class="light-wash" aria-hidden="true"></div>

    <!--{REGISTRATION PAGE}-->
    <main class="login-page">
        <a class="home-link" href="home.html" aria-label="InternBoard home">
            <span aria-hidden="true">🎓</span>
            Intern<span>Board</span>
        </a>

        <!--{LAMP INTRO}-->
        <section class="lamp-intro" aria-labelledby="lamp-heading">
            <div class="lamp-halo" aria-hidden="true"></div>
            <span class="lamp-cord" aria-hidden="true"></span>
            <button class="lamp-button" id="lampButton" type="button"
                aria-label="Turn on the lamp to reveal the registration form" aria-pressed="false">
                <span class="lamp-bulb" aria-hidden="true">💡</span>
                <span class="lamp-pull" aria-hidden="true"></span>
            </button>
            <h1 id="lamp-heading">Your next chapter starts here</h1>
            <p class="lamp-hint" id="lampHint">Click the lamp to turn on the light</p>
        </section>

        <!--{REGISTRATION CARD}-->
        <section class="login-card" id="registrationCard" aria-labelledby="registration-heading" aria-hidden="true">
            <div class="card-icon" aria-hidden="true">✨</div>
            <p class="eyebrow">JOIN INTERNBOARD</p>
            <h2 id="registration-heading">Create your account</h2>
            <p class="card-description">Build your profile and find opportunities made for you.</p>

            <!--{REGISTRATION FORM}-->
            <form id="registrationForm">
                <label for="fullName">Full name</label>
                <input id="fullName" name="fullName" type="text" autocomplete="name"
                    placeholder="Your name" minlength="2" required>

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email"
                    placeholder="you@example.com" required>

                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="new-password"
                        placeholder="At least 8 characters" minlength="8" required>
                    <button class="password-toggle" id="passwordToggle" type="button"
                        aria-label="Show password" aria-pressed="false">Show</button>
                </div>

                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
                    placeholder="Enter your password again" minlength="8" required>

                <button class="submit-button" type="submit">Create account <span aria-hidden="true">→</span></button>
                <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
            </form>

            <p class="signup-prompt">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>

    <!--{PAGE SCRIPT}-->
    <script>
        const lampButton = document.getElementById("lampButton");
        const registrationCard = document.getElementById("registrationCard");
        const fullNameInput = document.getElementById("fullName");
        const lampHint = document.getElementById("lampHint");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const passwordToggle = document.getElementById("passwordToggle");
        const registrationForm = document.getElementById("registrationForm");
        const formMessage = document.getElementById("formMessage");

        lampButton.addEventListener("click", () => {
            document.body.classList.add("lamp-on");
            lampButton.setAttribute("aria-pressed", "true");
            lampButton.setAttribute("aria-label", "Lamp is on");
            lampHint.textContent = "The light is on. Let's get you started.";
            registrationCard.setAttribute("aria-hidden", "false");
            window.setTimeout(() => fullNameInput.focus({ preventScroll: true }), 450);
        });

        passwordToggle.addEventListener("click", () => {
            const showingPassword = passwordInput.type === "password";
            passwordInput.type = showingPassword ? "text" : "password";
            confirmPasswordInput.type = showingPassword ? "text" : "password";
            passwordToggle.textContent = showingPassword ? "Hide" : "Show";
            passwordToggle.setAttribute("aria-label", showingPassword ? "Hide passwords" : "Show passwords");
            passwordToggle.setAttribute("aria-pressed", String(showingPassword));
        });

        function validatePasswordMatch() {
            const passwordsMatch = passwordInput.value === confirmPasswordInput.value;
            confirmPasswordInput.setCustomValidity(
                passwordsMatch ? "" : "Passwords do not match."
            );
        }

        passwordInput.addEventListener("input", validatePasswordMatch);
        confirmPasswordInput.addEventListener("input", validatePasswordMatch);

        registrationForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            validatePasswordMatch();
            if (!registrationForm.reportValidity()) {
                return;
            }

            const submitButton = registrationForm.querySelector('[type="submit"]');
            submitButton.disabled = true;
            formMessage.textContent = "Creating your account…";
            try {
                await window.InternBoardApi.register({
                    name: fullNameInput.value.trim(),
                    email: document.getElementById("email").value.trim(),
                    password: passwordInput.value
                });
                window.location.href = window.InternBoardSession.getPostLoginDestination();
            } catch (error) {
                formMessage.textContent = error.message;
                submitButton.disabled = false;
            }
        });
    </script>
    <script src="../functionality/Api.js"></script>
    <script src="../functionality/Session.js"></script>
</body>
</html>
